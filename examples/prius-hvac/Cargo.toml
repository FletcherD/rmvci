[package]
name = "prius-hvac"
description = "Read the Gen 2 Prius A/C amplifier air-mix servo position (7C4 / 21 43) through the Mini-VCI cable"
# Example binary, not a registry crate.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rmvci-core = { path = "../../rmvci-core" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
