[package]
name = "prius-hvac"
description = "Read the Gen 2 Prius (NHW20) A/C amplifier air-mix damper position over K-line through the Mini-VCI cable"
# Example binary, not a registry crate.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rmvci-core = { path = "../../rmvci-core" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
