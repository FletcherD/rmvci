[workspace]
resolver = "3"
members = ["rmvci-core", "rmvci-diag", "rmvci-j2534", "rmvci-android", "rmvci-net", "examples/prius-hvac"]
# cargo-fuzz builds its own crate with nightly + sanitizers; keeping it out
# of the workspace stops it from pinning the stable build's dependencies.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# Derived from libMVCI (GPL-3.0): structure ported from its C sources and the
# captured test vectors are carried over verbatim.
license = "GPL-3.0-or-later"
